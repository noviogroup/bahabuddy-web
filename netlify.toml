# npm is the single authoritative package manager (package-lock.json +
# .npmrc legacy-peer-deps). CI runs `npm ci`; Netlify installs with npm
# because package-lock.json is the only lockfile in the repo.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NODE_ENV = "production"
  NEXT_PRIVATE_STANDALONE = "true"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"
    Permissions-Policy = "camera=(), microphone=(self), geolocation=(self), payment=(self \"https://js.stripe.com\"), usb=(), serial=(), bluetooth=()"
    # Report-Only on purpose: observe violations in the browser console before
    # enforcing. Next 14 inline bootstrap scripts need 'unsafe-inline' (or a
    # middleware nonce) before this can be switched to Content-Security-Policy.
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'unsafe-inline' https://js.stripe.com https://maps.googleapis.com https://cdn.mxpnl.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; media-src 'self' blob: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.stripe.com https://maps.googleapis.com https://places.googleapis.com https://cdn.sanity.io https://*.api.sanity.io https://api-js.mixpanel.com https://api.mixpanel.com; frame-src 'self' https://js.stripe.com https://hooks.stripe.com https://www.google.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

# Apple Universal Links: the AASA file has no extension and must be served as
# application/json with no redirect for iOS to verify deep links. See
# public/.well-known/README.md.
[[headers]]
  for = "/.well-known/apple-app-site-association"
  [headers.values]
    Content-Type = "application/json"
